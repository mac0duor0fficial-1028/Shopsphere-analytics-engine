[project]
name = "shopsphere-orchestration"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "dagster>=1.10,<1.12",
  "dagster-dbt>=0.26,<0.28",
  "dagster-webserver>=1.10,<1.12",
  "dbt-snowflake>=1.10,<1.11",
  "dbt-core>=1.10,<1.11",
  "snowflake-connector-python>=3.12",
  "cryptography",
  "psycopg[binary]>=3.2",
  "requests",
]

[tool.dagster]
module_name = "shopsphere_orchestration.definitions"

[tool.setuptools.packages.find]
include = ["shopsphere_orchestration*"]
